name: mirror_scorpion_v2
description: "Mirror Scorpion - Translation, Inspiration, AI, Games"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  speech_to_text: ^6.6.2
  flutter_tts: ^4.1.0
  http: ^1.3.0
  camera: ^0.11.1+1
  camera_android_camerax: ^0.6.10+1
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_translation: ^0.17.0
  google_mlkit_commons: ^0.11.0
  shared_preferences: ^2.5.5
  permission_handler: ^11.4.0
  path_provider: ^2.2.1
  url_launcher: ^6.3.1
  audioplayers: ^6.4.0
  record: ^6.2.0
  flutter_local_notifications: ^19.0.0
  share_plus: ^10.1.4
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_icons:
  android: true
  image_path: "assets/images/scorpion_icon.jpeg"

flutter:
  assets:
    - assets/data/
    - assets/images/

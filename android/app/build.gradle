plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterRoot = localProperties.getProperty('flutter.sdk') ?: System.getenv("FLUTTER_ROOT")

android {
    namespace "com.mirror.scorpion.v3"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.mirror.scorpion.v3"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.3.0"
    }
}

flutter {
    source "../../"
}

dependencies {
    // الربط الجبري لضمان رؤية FlutterActivity مع إصدار Kotlin الثابت
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.10"
}
